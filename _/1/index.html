<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NebulaPlay</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap" rel="stylesheet"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: black url(/images/colour-dark-grey-mz-vf.jpg) center center / cover no-repeat fixed;
    overflow-x: hidden; /* no horizontal scrollbar */
  }

  /* Top bar */
  nav {
    position: relative;
    width: 100%;
    height: 7vw;
    display: flex;
    align-items: center;
    backdrop-filter: blur(10px) saturate(200%) brightness(70%);
    padding: 0 1%;
    z-index: 10;
  }
  nav img {
    width: 95px;
    height: auto;
    margin-right: 1%;
    border-radius: 1vw;
  }
  nav h3 {
    font-size: 4vw;
    font-weight: 800;
    color: white;
    font-family: 'Montserrat', sans-serif;
  }

  /* Game container */
  .content {
    margin-top: 2vh; /* small scroll before game */
    padding: 0 16px 16px 16px;
    box-sizing: border-box;
    margin-right: 300px; /* reserve space for ad */
  }
  .game-wrap {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 96.5vh; /* refined height */
    border-radius: 8px;
    overflow: hidden;
  }
  .game-wrap::before {
    content: "";
    position: absolute;
    inset: 0;
    background: url(/images/ubackground.png) center center / cover no-repeat;
    z-index: 0;
  }
  .game-wrap iframe {
    position: relative;
    width: 100%;
    height: 100%;
    border: none;
    border-radius: 8px;
    background: transparent;
    z-index: 1;
  }

  /* Right rail container for sticky ad */
  .side-rail {
    position: fixed;
    top: 0;
    right: 0;
    width: 300px;
    height: 100vh; /* full viewport */
    display: flex;
    align-items: flex-start; /* keep ad at top */
    justify-content: center;
    pointer-events: none; /* prevent blocking content */
  }
  .side-ad {
    position: sticky;
    top: 0;
    width: 300px;
    height: 600px;
    z-index: 9999;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    backdrop-filter: blur(6px) saturate(140%) brightness(85%);
    pointer-events: auto; /* restore clickability for ad */
  }
</style>
</head>
<body>
<nav>
  <a class="logo-link" data-href="/" style="cursor:pointer;">
    <img alt="logo" src="/images/logo.png"/>
  </a>
  <h3>Drive Mad</h3>
</nav>

<div class="content">
  <div class="game-wrap">
    <iframe sandbox="allow-scripts allow-same-origin" data-delayed-src="/storage/Drive Mad.html"></iframe>
  </div>
</div>

<!-- Right rail with sticky ad -->
<div class="side-rail">
  <aside class="side-ad">
    <div id="div-gpt-ad-1757794050642-0" style="width:300px;height:600px;"></div>
  </aside>
</div>

<script>
  // Logo click same tab
  document.querySelectorAll('.logo-link').forEach(link => {
    link.addEventListener('click', e => {
      e.preventDefault();
      window.location.href = link.dataset.href;
    });
  });

  // Disable right-click
  document.addEventListener("contextmenu", e => e.preventDefault());

  // Delay game loading by 2 seconds
  setTimeout(() => {
    const gameIframe = document.querySelector('iframe[data-delayed-src]');
    if (gameIframe) {
      gameIframe.src = gameIframe.getAttribute('data-delayed-src');
    }
  }, 2000);

  // GAM display
  window.googletag = window.googletag || {cmd: []};
  googletag.cmd.push(() => { googletag.display('div-gpt-ad-1757794050642-0'); });
</script>
</body>
</html>
